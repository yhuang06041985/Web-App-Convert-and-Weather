<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" width="280" height="120">
  <defs>
    <!-- Pitch Black Midnight Sky Gradient (2 AM - Darkest Point of Night) -->
    <linearGradient id="sky2am" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02040A" />
      <stop offset="50%" stop-color="#050814" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>

    <!-- Cold Crisp 2 AM Lunar Radial Glow -->
    <radialGradient id="moonGlow2am" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#EAB308" stop-opacity="0.3" />
      <stop offset="65%" stop-color="#38BDF8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Deep Night Dark Volumetric Cloud Gradients -->
    <linearGradient id="nightCloudFront2am" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="nightCloudBack2am" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#02040A" stop-opacity="0.15" />
    </linearGradient>

    <!-- Soft Core Glow Filter -->
    <filter id="moonCoreGlow2am" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Weather Card Background (Dark Sky) -->
  <rect x="8" y="8" width="264" height="104" rx="20" fill="url(#sky2am)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Celestial Arc Path -->
  <path d="M 35 85 Q 140 18 245 85" fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />

  <!-- Crisp Deep Midnight Stars -->
  <circle cx="34" cy="24" r="1.2" fill="#FFFFFF" opacity="0.95" />
  <circle cx="62" cy="44" r="0.8" fill="#FFFFFF" opacity="0.6" />
  <circle cx="92" cy="20" r="1.5" fill="#FEF08A" opacity="0.9" />
  <circle cx="125" cy="38" r="0.9" fill="#FFFFFF" opacity="0.7" />
  <circle cx="152" cy="20" r="1.1" fill="#FFFFFF" opacity="0.85" />
  <circle cx="225" cy="26" r="1.2" fill="#FFFFFF" opacity="0.9" />
  <circle cx="250" cy="48" r="0.8" fill="#FEF08A" opacity="0.5" />

  <!-- Background Cloud Layer -->
  <path d="M 25 88 C 25 78 35 72 45 72 C 48 72 52 73 55 75 C 60 67 70 62 82 62 C 95 62 105 70 108 80 C 112 78 116 78 120 78 C 130 78 138 84 138 88 Z" fill="url(#nightCloudBack2am)" />

  <!-- Active 2 AM Crescent Moon (Descending Lower on Western Arc) -->
  <g transform="translate(198, 52)">
    <!-- Moon Atmosphere Halo -->
    <circle cx="0" cy="0" r="40" fill="url(#moonGlow2am)" />

    <!-- Moon Core -->
    <path d="M -11 -20 A 20 20 0 1 0 16 15 A 15 15 0 1 1 -11 -20 Z" fill="#FACC15" filter="url(#moonCoreGlow2am)" />
    <path d="M -11 -20 A 20 20 0 1 0 16 15 A 15 15 0 1 1 -11 -20 Z" fill="#FEF08A" />
  </g>

  <!-- Foreground Volumetric Cloud Layer -->
  <path d="M 80 92 C 80 84 88 78 98 78 C 101 78 104 79 107 81 C 112 73 122 68 134 68 C 147 68 157 76 160 86 C 164 84 169 84 173 84 C 183 84 192 90 192 92 Z" fill="url(#nightCloudFront2am)" opacity="0.85" />

  <!-- Inactive Sun (Far Below Horizon) -->
  <g transform="translate(35, 85)" opacity="0.05">
    <circle cx="0" cy="0" r="14" fill="#475569" />
  </g>
</svg>
