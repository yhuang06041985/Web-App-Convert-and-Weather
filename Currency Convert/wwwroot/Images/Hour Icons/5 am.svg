<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" width="280" height="120">
  <defs>
    <!-- Early Dawn Sky (5 AM Light-to-Dark Transition: Horizon Orange to Dark Indigo Night Above) -->
    <linearGradient id="sky5am" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />    <!-- Deep Night Top -->
      <stop offset="35%" stop-color="#1E1B4B" />   <!-- Pre-Dawn Indigo -->
      <stop offset="70%" stop-color="#581C87" />   <!-- Deep Twilight Purple -->
      <stop offset="88%" stop-color="#9A3412" />   <!-- Warm Coral Transition -->
      <stop offset="100%" stop-color="#EA580C" />  <!-- Early Horizon Dawn Glow -->
    </linearGradient>

    <!-- Gentle Dawn Horizon Radial Glow -->
    <radialGradient id="sun5amGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FDBA74" stop-opacity="0.85" />
      <stop offset="45%" stop-color="#FB923C" stop-opacity="0.4" />
      <stop offset="80%" stop-color="#C2410C" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#C2410C" stop-opacity="0" />
    </radialGradient>

    <!-- Early Dawn Volumetric Clouds -->
    <linearGradient id="dawnCloudFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="dawnCloudBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.25" />
    </linearGradient>

    <!-- Soft Core Glow Filter -->
    <filter id="sun5amCoreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Weather Card Background -->
  <rect x="8" y="8" width="264" height="104" rx="20" fill="url(#sky5am)" stroke="#312E81" stroke-width="1.5" />

  <!-- Celestial Arc Path -->
  <path d="M 35 85 Q 140 18 245 85" fill="none" stroke="#FDBA74" stroke-width="2" stroke-dasharray="4 4" opacity="0.35" />

  <!-- Morning Star & Fading Night Stars (5 AM Pre-Dawn Sky) -->
  <circle cx="110" cy="22" r="1.5" fill="#FFFFFF" opacity="0.9" />
  <circle cx="155" cy="28" r="0.9" fill="#FFFFFF" opacity="0.6" />
  <circle cx="195" cy="36" r="0.8" fill="#FFFFFF" opacity="0.4" />

  <!-- Background Cloud Layer -->
  <path d="M 25 88 C 25 78 35 72 45 72 C 48 72 52 73 55 75 C 60 67 70 62 82 62 C 95 62 105 70 108 80 C 112 78 116 78 120 78 C 130 78 138 84 138 88 Z" fill="url(#dawnCloudBack)" />

  <!-- Rising Dawn Sun at 5 AM (Peeking above Eastern Horizon on Left Edge) -->
  <g transform="translate(48, 66)">
    <!-- Horizon Atmosphere Halo -->
    <circle cx="0" cy="0" r="34" fill="url(#sun5amGlow)" />

    <!-- Sun Core -->
    <circle cx="0" cy="0" r="13" fill="#F97316" filter="url(#sun5amCoreGlow)" />
    <circle cx="0" cy="0" r="10" fill="#FDBA74" />

    <!-- Soft Early Rays -->
    <g stroke="#FB923C" stroke-width="2" stroke-linecap="round" opacity="0.8">
      <line x1="0" y1="-22" x2="0" y2="-16" />
      <line x1="-22" y1="0" x2="-16" y2="0" />
      <line x1="16" y1="0" x2="22" y2="0" />
      <line x1="-15" y1="-15" x2="-11" y2="-11" />
      <line x1="11" y1="-11" x2="15" y2="-15" />
    </g>
  </g>

  <!-- Foreground Volumetric Cloud Layer -->
  <path d="M 80 92 C 80 84 88 78 98 78 C 101 78 104 79 107 81 C 112 73 122 68 134 68 C 147 68 157 76 160 86 C 164 84 169 84 173 84 C 183 84 192 90 192 92 Z" fill="url(#dawnCloudFront)" opacity="0.85" />

  <!-- Fading Moon (Set low on Western Horizon Right Edge) -->
  <g transform="translate(232, 74)" opacity="0.2">
    <path d="M -9 -16 A 16 16 0 1 0 13 12 A 12 12 0 1 1 -9 -16 Z" fill="#FDE047" />
  </g>
</svg>
