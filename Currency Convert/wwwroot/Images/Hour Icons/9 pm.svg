<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" width="280" height="120">
  <defs>
    <!-- 9 PM Night Sky Gradient (Deep Dark Slate to Indigo Abyss) -->
    <linearGradient id="sky9pm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />    <!-- Pure Midnight Dark Void -->
      <stop offset="50%" stop-color="#0F172A" />   <!-- Deep Night Slate -->
      <stop offset="80%" stop-color="#1E1B4B" />   <!-- Rich Indigo Night -->
      <stop offset="100%" stop-color="#1E293B" />  <!-- Soft Dark Navy Horizon -->
    </linearGradient>

    <!-- Cool Silver Lunar Radial Glow -->
    <radialGradient id="moonGlow9pm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="75%" stop-color="#1E1B4B" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- Nighttime Dark Volumetric Clouds -->
    <linearGradient id="cloudFront9pm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="cloudBack9pm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.25" />
    </linearGradient>

    <!-- Soft Core Glow Filter -->
    <filter id="moonCoreGlow9pm" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Weather Card Background -->
  <rect x="8" y="8" width="264" height="104" rx="20" fill="url(#sky9pm)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Stars in Night Sky -->
  <g fill="#FFFFFF" opacity="0.85">
    <circle cx="32" cy="24" r="1.2" />
    <circle cx="62" cy="18" r="1.5" opacity="0.9" />
    <circle cx="92" cy="32" r="0.8" />
    <circle cx="125" cy="48" r="1" />
    <circle cx="158" cy="22" r="1.3" opacity="0.8" />
    <circle cx="192" cy="36" r="0.9" />
    <circle cx="222" cy="18" r="1.4" opacity="0.9" />
    <circle cx="252" cy="38" r="1" />
  </g>

  <!-- Celestial Arc Path -->
  <path d="M 35 85 Q 140 18 245 85" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4" opacity="0.3" />

  <!-- Background Cloud Layer -->
  <path d="M 25 88 C 25 78 35 72 45 72 C 48 72 52 73 55 75 C 60 67 70 62 82 62 C 95 62 105 70 108 80 C 112 78 116 78 120 78 C 130 78 138 84 138 88 Z" fill="url(#cloudBack9pm)" />

  <!-- 9 PM Moon (Steeply Ascending Higher Toward Zenith) -->
  <g transform="translate(88, 42)">
    <!-- Atmosphere Moon Halo -->
    <circle cx="0" cy="0" r="36" fill="url(#moonGlow9pm)" />

    <!-- Crescent Moon Core -->
    <g filter="url(#moonCoreGlow9pm)">
      <path d="M 12 -12 A 15.5 15.5 0 1 0 12 12 A 12.5 12.5 0 1 1 12 -12 Z" fill="#F0F9FF" />
    </g>
  </g>

  <!-- Foreground Volumetric Cloud Layer -->
  <path d="M 80 92 C 80 84 88 78 98 78 C 101 78 104 79 107 81 C 112 73 122 68 134 68 C 147 68 157 76 160 86 C 164 84 169 84 173 84 C 183 84 192 90 192 92 Z" fill="url(#cloudFront9pm)" opacity="0.8" />
</svg>
