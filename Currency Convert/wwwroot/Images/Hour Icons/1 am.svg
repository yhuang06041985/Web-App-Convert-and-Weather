<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" width="280" height="120">
  <defs>
    <!-- Deepest Midnight Sky Gradient (1 AM Pitch Dark Base) -->
    <linearGradient id="sky1am" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="60%" stop-color="#070A14" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Cool Luminous 1 AM Lunar Radial Glow -->
    <radialGradient id="moonGlow1am" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#FACC15" stop-opacity="0.35" />
      <stop offset="65%" stop-color="#38BDF8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Deep Night Volumetric Cloud Gradients -->
    <linearGradient id="nightCloudFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="nightCloudBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0.2" />
    </linearGradient>

    <!-- Soft Core Glow Filter -->
    <filter id="moonCoreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Weather Card Background (Dark Sky) -->
  <rect x="8" y="8" width="264" height="104" rx="20" fill="url(#sky1am)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Celestial Trajectory Arc -->
  <path d="M 35 85 Q 140 18 245 85" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" opacity="0.35" />

  <!-- Deep Night Stars (Crisp & Bright) -->
  <circle cx="38" cy="28" r="1.2" fill="#FFFFFF" opacity="0.95" />
  <circle cx="68" cy="40" r="0.8" fill="#FFFFFF" opacity="0.7" />
  <circle cx="98" cy="22" r="1.5" fill="#FEF08A" opacity="0.9" />
  <circle cx="132" cy="34" r="1" fill="#FFFFFF" opacity="0.8" />
  <circle cx="165" cy="22" r="0.8" fill="#FFFFFF" opacity="0.5" />
  <circle cx="212" cy="28" r="1.2" fill="#FFFFFF" opacity="0.85" />
  <circle cx="246" cy="46" r="0.9" fill="#FEF08A" opacity="0.65" />

  <!-- Background Cloud Layer -->
  <path d="M 25 88 C 25 78 35 72 45 72 C 48 72 52 73 55 75 C 60 67 70 62 82 62 C 95 62 105 70 108 80 C 112 78 116 78 120 78 C 130 78 138 84 138 88 Z" fill="url(#nightCloudBack)" />

  <!-- Active 1 AM Crescent Moon (Descending along early night arc) -->
  <g transform="translate(180, 44)">
    <!-- Atmospheric Moon Halo -->
    <circle cx="0" cy="0" r="40" fill="url(#moonGlow1am)" />

    <!-- Moon Core -->
    <path d="M -11 -20 A 20 20 0 1 0 16 15 A 15 15 0 1 1 -11 -20 Z" fill="#FACC15" filter="url(#moonCoreGlow)" />
    <path d="M -11 -20 A 20 20 0 1 0 16 15 A 15 15 0 1 1 -11 -20 Z" fill="#FEF08A" />
  </g>

  <!-- Foreground Volumetric Cloud Layer -->
  <path d="M 80 92 C 80 84 88 78 98 78 C 101 78 104 79 107 81 C 112 73 122 68 134 68 C 147 68 157 76 160 86 C 164 84 169 84 173 84 C 183 84 192 90 192 92 Z" fill="url(#nightCloudFront)" opacity="0.85" />

  <!-- Inactive Sun (Below horizon on left edge) -->
  <g transform="translate(35, 85)" opacity="0.08">
    <circle cx="0" cy="0" r="14" fill="#64748B" />
  </g>
</svg>
