<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" width="280" height="120">
  <defs>
    <!-- 11 PM Deep Late Night Sky Gradient (Deepest Celestial Black-Navy) -->
    <linearGradient id="sky11pm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#020617" />    <!-- Pitch Black Midnight Sky Top -->
      <stop offset="50%" stop-color="#090D16" />   <!-- Deepest Cosmos Navy -->
      <stop offset="80%" stop-color="#0F172A" />   <!-- Dark Slate Night -->
      <stop offset="100%" stop-color="#1E1B4B" />  <!-- Soft Deep Midnight Indigo Horizon -->
    </linearGradient>

    <!-- Glowing Silver Moon Halo Gradient -->
    <radialGradient id="moonGlow11pm" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#38BDF8" stop-opacity="0.3" />
      <stop offset="75%" stop-color="#1E1B4B" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- Late Night Volumetric Cloud Gradients -->
    <linearGradient id="cloudFront11pm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="cloudBack11pm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.2" />
    </linearGradient>

    <!-- Soft Core Glow Filter -->
    <filter id="moonCoreGlow11pm" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Weather Card Background -->
  <rect x="8" y="8" width="264" height="104" rx="20" fill="url(#sky11pm)" stroke="#0F172A" stroke-width="1.5" />

  <!-- Stars in Deep Late Night Sky -->
  <g fill="#FFFFFF" opacity="0.9">
    <circle cx="30" cy="20" r="1.2" />
    <circle cx="52" cy="40" r="1.5" opacity="0.95" />
    <circle cx="78" cy="18" r="0.8" />
    <circle cx="102" cy="50" r="1" />
    <circle cx="165" cy="22" r="1.4" opacity="0.85" />
    <circle cx="198" cy="38" r="0.9" />
    <circle cx="228" cy="20" r="1.5" opacity="0.9" />
    <circle cx="254" cy="42" r="1.1" />
  </g>

  <!-- Celestial Arc Path -->
  <path d="M 35 85 Q 140 18 245 85" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="4 4" opacity="0.25" />

  <!-- Background Cloud Layer -->
  <path d="M 25 88 C 25 78 35 72 45 72 C 48 72 52 73 55 75 C 60 67 70 62 82 62 C 95 62 105 70 108 80 C 112 78 116 78 120 78 C 130 78 138 84 138 88 Z" fill="url(#cloudBack11pm)" />

  <!-- 11 PM Moon (Nearing Mid-Night Peak / Zenith Position) -->
  <g transform="translate(126, 25)">
    <!-- Atmosphere Moon Halo -->
    <circle cx="0" cy="0" r="38" fill="url(#moonGlow11pm)" />

    <!-- Late Night Crescent Moon Core -->
    <g filter="url(#moonCoreGlow11pm)">
      <path d="M 12 -12 A 16 16 0 1 0 12 12 A 13 13 0 1 1 12 -12 Z" fill="#F0F9FF" />
    </g>
  </g>

  <!-- Foreground Volumetric Cloud Layer -->
  <path d="M 80 92 C 80 84 88 78 98 78 C 101 78 104 79 107 81 C 112 73 122 68 134 68 C 147 68 157 76 160 86 C 164 84 169 84 173 84 C 183 84 192 90 192 92 Z" fill="url(#cloudFront11pm)" opacity="0.8" />
</svg>
