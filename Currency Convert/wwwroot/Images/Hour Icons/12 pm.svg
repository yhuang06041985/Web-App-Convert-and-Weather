<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" width="280" height="120">
  <defs>
    <!-- 12 PM Noon Sky Gradient (Peak Daylight Brightness & Azure Luminance) -->
    <linearGradient id="sky12pm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />    <!-- Deep Vibrant Blue Zenith -->
      <stop offset="45%" stop-color="#38BDF8" />   <!-- Brilliant Noon Daylight -->
      <stop offset="80%" stop-color="#7DD3FC" />   <!-- High Luminance Atmosphere -->
      <stop offset="100%" stop-color="#BAE6FD" />  <!-- Crisp White-Blue Horizon -->
    </linearGradient>

    <!-- Intense Noon Zenith Sunlight Radial Glow -->
    <radialGradient id="sun12pmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="30%" stop-color="#FEF08A" stop-opacity="0.9" />
      <stop offset="65%" stop-color="#F59E0B" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- Crisp Peak-Daylight Volumetric Cloud Gradients -->
    <linearGradient id="cloudFront12pm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="cloudBack12pm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.6" />
    </linearGradient>

    <!-- High-Intensity Zenith Core Glow Filter -->
    <filter id="sun12pmCoreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Weather Card Background -->
  <rect x="8" y="8" width="264" height="104" rx="20" fill="url(#sky12pm)" stroke="#0284C7" stroke-width="1.5" />

  <!-- Celestial Arc Path -->
  <path d="M 35 85 Q 140 18 245 85" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4" opacity="0.75" />

  <!-- Background Cloud Layer -->
  <path d="M 25 88 C 25 78 35 72 45 72 C 48 72 52 73 55 75 C 60 67 70 62 82 62 C 95 62 105 70 108 80 C 112 78 116 78 120 78 C 130 78 138 84 138 88 Z" fill="url(#cloudBack12pm)" />

  <!-- 12 PM Noon Sun (Highest Peak Apex / Zenith) -->
  <g transform="translate(140, 21)">
    <!-- Atmosphere Sun Halo -->
    <circle cx="0" cy="0" r="48" fill="url(#sun12pmGlow)" />

    <!-- Sun Core -->
    <circle cx="0" cy="0" r="20" fill="#F59E0B" filter="url(#sun12pmCoreGlow)" />
    <circle cx="0" cy="0" r="17" fill="#FEF08A" />
    <circle cx="0" cy="0" r="13" fill="#FFFFFF" opacity="0.95" />

    <!-- Radiant High-Noon Rays -->
    <g stroke="#F59E0B" stroke-width="2.8" stroke-linecap="round">
      <line x1="0" y1="-35" x2="0" y2="-25" />
      <line x1="0" y1="25" x2="0" y2="35" />
      <line x1="-35" y1="0" x2="-25" y2="0" />
      <line x1="25" y1="0" x2="35" y2="0" />
      <line x1="-24" y1="-24" x2="-17" y2="-17" />
      <line x1="17" y1="-17" x2="24" y2="-24" />
      <line x1="-24" y1="24" x2="-17" y2="17" />
      <line x1="17" y1="17" x2="24" y2="24" />
    </g>
  </g>

  <!-- Foreground Volumetric Cloud Layer -->
  <path d="M 80 92 C 80 84 88 78 98 78 C 101 78 104 79 107 81 C 112 73 122 68 134 68 C 147 68 157 76 160 86 C 164 84 169 84 173 84 C 183 84 192 90 192 92 Z" fill="url(#cloudFront12pm)" opacity="0.92" />
</svg>
