<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" width="280" height="120">
  <defs>
    <!-- 8 AM Morning Sky Gradient (Clear Sky Blue Top to Warm Bright Horizon) -->
    <linearGradient id="sky8am" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />    <!-- Bright Sky Blue Top -->
      <stop offset="45%" stop-color="#38BDF8" />   <!-- Soft Daylight Blue -->
      <stop offset="75%" stop-color="#7DD3FC" />   <!-- Light Crisp Atmosphere -->
      <stop offset="90%" stop-color="#BAE6FD" />   <!-- Fresh Morning Glow -->
      <stop offset="100%" stop-color="#FEF08A" />  <!-- Soft Warm Horizon -->
    </linearGradient>

    <!-- Vibrant 8 AM Sunlight Radial Glow -->
    <radialGradient id="sun8amGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#FDE047" stop-opacity="0.6" />
      <stop offset="75%" stop-color="#F59E0B" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- Morning Volumetric Clouds -->
    <linearGradient id="cloudFront8am" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.98" />
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.88" />
    </linearGradient>
    <linearGradient id="cloudBack8am" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.4" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="sun8amCoreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Weather Card Background -->
  <rect x="8" y="8" width="264" height="104" rx="20" fill="url(#sky8am)" stroke="#0284C7" stroke-width="1.5" />

  <!-- Celestial Arc Path -->
  <path d="M 35 85 Q 140 18 245 85" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />

  <!-- Background Cloud Layer -->
  <path d="M 25 88 C 25 78 35 72 45 72 C 48 72 52 73 55 75 C 60 67 70 62 82 62 C 95 62 105 70 108 80 C 112 78 116 78 120 78 C 130 78 138 84 138 88 Z" fill="url(#cloudBack8am)" />

  <!-- 8 AM Morning Sun (Ascending Higher on Eastern Arc with Strong Daylight) -->
  <g transform="translate(98, 44)">
    <!-- Atmosphere Sun Halo -->
    <circle cx="0" cy="0" r="40" fill="url(#sun8amGlow)" />

    <!-- Sun Core -->
    <circle cx="0" cy="0" r="16" fill="#F59E0B" filter="url(#sun8amCoreGlow)" />
    <circle cx="0" cy="0" r="13" fill="#FEF08A" />

    <!-- Bright Morning Sun Rays -->
    <g stroke="#F59E0B" stroke-width="2.4" stroke-linecap="round">
      <line x1="0" y1="-28" x2="0" y2="-20" />
      <line x1="0" y1="20" x2="0" y2="28" />
      <line x1="-28" y1="0" x2="-20" y2="0" />
      <line x1="20" y1="0" x2="28" y2="0" />
      <line x1="-20" y1="-20" x2="-14" y2="-14" />
      <line x1="14" y1="-14" x2="20" y2="-20" />
      <line x1="-20" y1="20" x2="-14" y2="14" />
      <line x1="14" y1="14" x2="20" y2="20" />
    </g>
  </g>

  <!-- Foreground Volumetric Cloud Layer -->
  <path d="M 80 92 C 80 84 88 78 98 78 C 101 78 104 79 107 81 C 112 73 122 68 134 68 C 147 68 157 76 160 86 C 164 84 169 84 173 84 C 183 84 192 90 192 92 Z" fill="url(#cloudFront8am)" opacity="0.9" />
</svg>
