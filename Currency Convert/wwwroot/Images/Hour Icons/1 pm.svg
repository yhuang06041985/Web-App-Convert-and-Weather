<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" width="280" height="120">
  <defs>
    <!-- 1 PM Sky Gradient (Peak Afternoon Brightness) -->
    <linearGradient id="sky1pm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />    <!-- Vibrant Sky Blue -->
      <stop offset="50%" stop-color="#38BDF8" />   <!-- Bright Daylight Blue -->
      <stop offset="85%" stop-color="#7DD3FC" />   <!-- Soft Atmosphere Blue -->
      <stop offset="100%" stop-color="#BAE6FD" />  <!-- Bright Horizon Tone -->
    </linearGradient>

    <!-- Strong Afternoon Sunlight Radial Glow -->
    <radialGradient id="sun1pmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="35%" stop-color="#FEF08A" stop-opacity="0.85" />
      <stop offset="70%" stop-color="#F59E0B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0" />
    </radialGradient>

    <!-- Crisp Afternoon Cloud Gradients -->
    <linearGradient id="cloudFront1pm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.99" />
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.92" />
    </linearGradient>
    <linearGradient id="cloudBack1pm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#BAE6FD" stop-opacity="0.5" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="sun1pmCoreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Weather Card Background -->
  <rect x="8" y="8" width="264" height="104" rx="20" fill="url(#sky1pm)" stroke="#0284C7" stroke-width="1.5" />

  <!-- Celestial Arc Path -->
  <path d="M 35 85 Q 140 18 245 85" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4" opacity="0.65" />

  <!-- Background Cloud Layer -->
  <path d="M 25 88 C 25 78 35 72 45 72 C 48 72 52 73 55 75 C 60 67 70 62 82 62 C 95 62 105 70 108 80 C 112 78 116 78 120 78 C 130 78 138 84 138 88 Z" fill="url(#cloudBack1pm)" />

  <!-- 1 PM Sun (Slightly Past Zenith, Moving Western Arc) -->
  <g transform="translate(148, 26)">
    <!-- Atmosphere Sun Halo -->
    <circle cx="0" cy="0" r="45" fill="url(#sun1pmGlow)" />

    <!-- Sun Core -->
    <circle cx="0" cy="0" r="18" fill="#F59E0B" filter="url(#sun1pmCoreGlow)" />
    <circle cx="0" cy="0" r="15" fill="#FEF08A" />
    <circle cx="0" cy="0" r="11" fill="#FFFFFF" opacity="0.85" />

    <!-- Brilliant Afternoon Rays -->
    <g stroke="#F59E0B" stroke-width="2.6" stroke-linecap="round">
      <line x1="0" y1="-32" x2="0" y2="-23" />
      <line x1="0" y1="23" x2="0" y2="32" />
      <line x1="-32" y1="0" x2="-23" y2="0" />
      <line x1="23" y1="0" x2="32" y2="0" />
      <line x1="-22" y1="-22" x2="-16" y2="-16" />
      <line x1="16" y1="-16" x2="22" y2="-22" />
      <line x1="-22" y1="22" x2="-16" y2="16" />
      <line x1="16" y1="16" x2="22" y2="22" />
    </g>
  </g>

  <!-- Foreground Volumetric Cloud Layer -->
  <path d="M 80 92 C 80 84 88 78 98 78 C 101 78 104 79 107 81 C 112 73 122 68 134 68 C 147 68 157 76 160 86 C 164 84 169 84 173 84 C 183 84 192 90 192 92 Z" fill="url(#cloudFront1pm)" opacity="0.9" />
</svg>
