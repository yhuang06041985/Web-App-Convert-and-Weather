<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" width="280" height="120">
  <defs>
    <!-- Dark Night to Pre-Dawn Horizon Gradient (3 AM Sky) -->
    <linearGradient id="sky3am" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#02040A" />
      <stop offset="60%" stop-color="#070C1B" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Low Western Crescent Moon Glow -->
    <radialGradient id="moonGlow3am" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#EAB308" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Night Volumetric Clouds -->
    <linearGradient id="nightCloudFront3am" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0.78" />
    </linearGradient>
    <linearGradient id="nightCloudBack3am" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#02040A" stop-opacity="0.12" />
    </linearGradient>

    <!-- Soft Core Glow Filter -->
    <filter id="moonCoreGlow3am" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Weather Card Background -->
  <rect x="8" y="8" width="264" height="104" rx="20" fill="url(#sky3am)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Celestial Arc Path -->
  <path d="M 35 85 Q 140 18 245 85" fill="none" stroke="#1E293B" stroke-width="2" stroke-dasharray="4 4" opacity="0.5" />

  <!-- Pre-Dawn Deep Night Stars -->
  <circle cx="32" cy="22" r="1.1" fill="#FFFFFF" opacity="0.9" />
  <circle cx="58" cy="42" r="0.8" fill="#FFFFFF" opacity="0.55" />
  <circle cx="88" cy="18" r="1.4" fill="#FEF08A" opacity="0.85" />
  <circle cx="120" cy="32" r="0.9" fill="#FFFFFF" opacity="0.65" />
  <circle cx="150" cy="18" r="1.1" fill="#FFFFFF" opacity="0.8" />
  <circle cx="182" cy="28" r="0.8" fill="#FFFFFF" opacity="0.5" />
  <circle cx="240" cy="38" r="1.2" fill="#FFFFFF" opacity="0.85" />

  <!-- Background Cloud Layer -->
  <path d="M 25 88 C 25 78 35 72 45 72 C 48 72 52 73 55 75 C 60 67 70 62 82 62 C 95 62 105 70 108 80 C 112 78 116 78 120 78 C 130 78 138 84 138 88 Z" fill="url(#nightCloudBack3am)" />

  <!-- Active 3 AM Crescent Moon (Descending Low on Western Horizon) -->
  <g transform="translate(214, 62)">
    <!-- Moon Atmosphere Halo -->
    <circle cx="0" cy="0" r="38" fill="url(#moonGlow3am)" />

    <!-- Moon Core -->
    <path d="M -11 -20 A 20 20 0 1 0 16 15 A 15 15 0 1 1 -11 -20 Z" fill="#FACC15" filter="url(#moonCoreGlow3am)" />
    <path d="M -11 -20 A 20 20 0 1 0 16 15 A 15 15 0 1 1 -11 -20 Z" fill="#FEF08A" />
  </g>

  <!-- Foreground Volumetric Cloud Layer -->
  <path d="M 80 92 C 80 84 88 78 98 78 C 101 78 104 79 107 81 C 112 73 122 68 134 68 C 147 68 157 76 160 86 C 164 84 169 84 173 84 C 183 84 192 90 192 92 Z" fill="url(#nightCloudFront3am)" opacity="0.85" />

  <!-- Sun Below Horizon (Far Left) -->
  <g transform="translate(35, 85)" opacity="0.04">
    <circle cx="0" cy="0" r="14" fill="#475569" />
  </g>
</svg>
