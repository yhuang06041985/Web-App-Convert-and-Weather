<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 120" width="280" height="120">
  <defs>
    <!-- 4 PM Late Afternoon Sky Gradient (Deepening Blue Transitioning into Amber/Gold) -->
    <linearGradient id="sky4pm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0369A1" />    <!-- Deeper Sky Blue Top -->
      <stop offset="40%" stop-color="#0284C7" />   <!-- Softening Daytime Blue -->
      <stop offset="70%" stop-color="#BAE6FD" />   <!-- Pale Horizon Blue -->
      <stop offset="88%" stop-color="#FCD34D" />   <!-- Warm Golden Hour Glow -->
      <stop offset="100%" stop-color="#F97316" />  <!-- Late Afternoon Orange Horizon -->
    </linearGradient>

    <!-- Warm Golden-Amber Sunlight Radial Glow -->
    <radialGradient id="sun4pmGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FEF08A" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#F59E0B" stop-opacity="0.65" />
      <stop offset="75%" stop-color="#EA580C" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#EA580C" stop-opacity="0" />
    </radialGradient>

    <!-- Late-Afternoon Clouds (Catching Golden Warmth) -->
    <linearGradient id="cloudFront4pm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96" />
      <stop offset="70%" stop-color="#FEF3C7" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#E0F2FE" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="cloudBack4pm" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#FDE68A" stop-opacity="0.35" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="sun4pmCoreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Weather Card Background -->
  <rect x="8" y="8" width="264" height="104" rx="20" fill="url(#sky4pm)" stroke="#0369A1" stroke-width="1.5" />

  <!-- Celestial Arc Path -->
  <path d="M 35 85 Q 140 18 245 85" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="4 4" opacity="0.55" />

  <!-- Background Cloud Layer -->
  <path d="M 25 88 C 25 78 35 72 45 72 C 48 72 52 73 55 75 C 60 67 70 62 82 62 C 95 62 105 70 108 80 C 112 78 116 78 120 78 C 130 78 138 84 138 88 Z" fill="url(#cloudBack4pm)" />

  <!-- 4 PM Late Afternoon Sun (Descending Near Western Horizon) -->
  <g transform="translate(198, 55)">
    <!-- Atmosphere Sun Halo -->
    <circle cx="0" cy="0" r="38" fill="url(#sun4pmGlow)" />

    <!-- Sun Core -->
    <circle cx="0" cy="0" r="15" fill="#EA580C" filter="url(#sun4pmCoreGlow)" />
    <circle cx="0" cy="0" r="12" fill="#FEF08A" />

    <!-- Warm Golden/Amber Sun Rays -->
    <g stroke="#F59E0B" stroke-width="2.3" stroke-linecap="round">
      <line x1="0" y1="-26" x2="0" y2="-18" />
      <line x1="0" y1="18" x2="0" y2="26" />
      <line x1="-26" y1="0" x2="-18" y2="0" />
      <line x1="18" y1="0" x2="26" y2="0" />
      <line x1="-18" y1="-18" x2="-13" y2="-13" />
      <line x1="13" y1="-13" x2="18" y2="-18" />
      <line x1="-18" y1="18" x2="-13" y2="13" />
      <line x1="13" y1="13" x2="18" y2="18" />
    </g>
  </g>

  <!-- Foreground Volumetric Cloud Layer -->
  <path d="M 80 92 C 80 84 88 78 98 78 C 101 78 104 79 107 81 C 112 73 122 68 134 68 C 147 68 157 76 160 86 C 164 84 169 84 173 84 C 183 84 192 90 192 92 Z" fill="url(#cloudFront4pm)" opacity="0.88" />
</svg>
